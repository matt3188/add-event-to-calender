<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Add event to calendar</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px 20px; background:#f5f5f7; color:#111; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,520px); text-align:center; }
    h1 { margin:0 0 12px; font-size:clamp(2rem,8vw,3.5rem); line-height:1; }
    p { margin:0 0 28px; color:#666; }
    button { width:100%; min-height:120px; border:0; border-radius:28px; padding:24px; font:inherit; font-size:clamp(1.5rem,7vw,2.5rem); font-weight:800; background:#111; color:#fff; cursor:pointer; }
    .event-details { margin-top:24px; color:#777; }
  </style>
</head>
<body>
  <main>
    <h1>Add to Calendar</h1>
    <p>Tap the button and your phone will open the event ready to add.</p>
    <button id="add-to-calendar" type="button">📅 Add to Calendar</button>
    <div class="event-details" id="event-details"></div>
  </main>

  <script>
    // Change only these values when updating the event.
    const eventConfig = {
      title: "POC Calendar Event",
      start: "20260907T180000",
      end: "20260907T190000",
      location: "",
      description: "Created from the Add Event to Calendar POC."
    };

    const escapeIcsText = (value) => String(value)
      .replace(/\\/g, "\\\\")
      .replace(/;/g, "\\;")
      .replace(/,/g, "\\,")
      .replace(/\n/g, "\\n");

    const makeUtcTimestamp = () => new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z");

    const makeIcs = () => [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Add Event to Calendar//POC//EN",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH",
      "BEGIN:VEVENT",
      `UID:${Date.now()}@add-event-to-calender`,
      `DTSTAMP:${makeUtcTimestamp()}`,
      `DTSTART;TZID=Europe/London:${eventConfig.start}`,
      `DTEND;TZID=Europe/London:${eventConfig.end}`,
      `SUMMARY:${escapeIcsText(eventConfig.title)}`,
      `LOCATION:${escapeIcsText(eventConfig.location)}`,
      `DESCRIPTION:${escapeIcsText(eventConfig.description)}`,
      "END:VEVENT",
      "END:VCALENDAR"
    ].join("\r\n");

    document.getElementById("add-to-calendar").addEventListener("click", () => {
      const blob = new Blob([makeIcs()], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "event.ics";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    document.getElementById("event-details").textContent = eventConfig.title;
  </script>
</body>
</html>
